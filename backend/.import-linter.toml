# import-linter 架构分层契约
# 依据: AGENTS.md §4 + docs/review/10-architecture-layering.md
#
# 5 阶段分层(单向):
#   api → services → domain → repos → models
#
# 阶段 2 P1#21 范围: 配置 lint-imports 框架 + 验收已修分层(Repos→Models, Models 独立)。
# API→Services→Domain 这两层契约涉及历史代码大改,
# 留待 docs/tech-debt-tracker.md 跟踪 + 阶段 3/4 重构。
#
# 运行: cd backend && lint-imports

[tool.importlinter]
root_package = "app"

# 已修:repos 只能依赖 models(阶段 1 P0#3 已修复 knowledge_repo)
[[tool.importlinter.contracts]]
name = "Repositories depends only on Models"
type = "layers"
layers = [
    "app.repositories",
    "app.models",
]

# 已修:models 完全独立
[[tool.importlinter.contracts]]
name = "Models are standalone"
type = "independence"
modules = [
    "app.models",
]

# domain 不能反向依赖 services/tool_executor/memory 三个模块除外
[[tool.importlinter.contracts]]
name = "Domain depends on Repos/Models (NOT Services)"
type = "layers"
layers = [
    "app.domain",
    "app.repositories",
    "app.models",
]
exclusions = [
    "app.domain.agent.tool_executor -> app.services.diagnosis_service",
    "app.domain.agent.tool_executor -> app.services.hybrid_search",
    "app.domain.agent.memory -> app.services.embedding",
]